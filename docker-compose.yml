# Place this at your project ROOT (same level as Backend/ and Frontend/)

services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: Melina'sBakery-backend
    ports:
      - "9005:9005"
    env_file:
      - ./Backend/.env
    depends_on:
      - redis
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - Melina'sBakery-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: Melina'sBakery-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-http://localhost:5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9005/api}
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    networks:
      - Melina'sBakery-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: Melina'sBakery
    ports:
      - "6379:6379"
    networks:
      - Melina'sBakery-network
    restart: unless-stopped

networks:
  Melina'sBakery-network:
    driver: bridge