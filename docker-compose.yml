# Place this at your project ROOT (same level as Backend/ and Frontend/)

services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: melinasbakery-backend
    ports:
      - "9005:9005"
    env_file:
      - ./Backend/.env
    depends_on:
      - redis
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - melinasbakery-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: melinasbakery-frontend
    ports:
      - "5173:5173"
    environment:
      # IMPORTANT: do NOT default these to http://localhost. When another device on
      # the LAN opens the site, the browser on THAT device treats "localhost" as itself,
      # so every API call would hit a dead-end. Leaving them empty makes the frontend
      # auto-detect the host's LAN IP (see Frontend/src/constants/constants.tsx).
      VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    networks:
      - melinasbakery-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: melinasbakery-redis
    ports:
      - "6379:6379"
    networks:
      - melinasbakery-network
    restart: unless-stopped

networks:
  melinasbakery-network:
    driver: bridge